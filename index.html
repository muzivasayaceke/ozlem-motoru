<title>Aşk ve Özlem Motoru</title>
<style>
  :root {
    --bg: #fdf7f8;

    --muted: #7b6b72;
    --line: #eadfe3;
    --accent: #d6336c;
    --accent-soft: #fde8ef;
    --track: #f1e6ea;
    --warn: #e8590c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17111a;
      --card: #211823;
      --ink: #f6ecf1;
      --muted: #b09ba6;
      --line: #35283a;
      --accent: #ff6b9a;
      --accent-soft: #3a1f2e;
      --track: #2e2230;
      --warn: #ffa94d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 28px 18px 70px; }
  header h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: -0.02em; }
  header p { margin: 0; color: var(--muted); }

  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 20px; background: var(--track); padding: 5px; border-radius: 14px; }
  .tab {
    background: transparent; color: var(--muted); border: 0; border-radius: 10px;
    padding: 10px 6px; font: inherit; font-weight: 700; font-size: 14px; line-height: 1.25; cursor: pointer; transition: all .15s;
  }
  .tab[aria-selected="true"] { background: var(--card); color: var(--accent); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .panel[hidden] { display: none; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-top: 18px; }
  .card h2 { margin: 0 0 12px; font-size: 16px; }
  .intro { margin: 0 0 4px; font-size: 14px; color: var(--muted); }
  .scale-legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 12px; gap: 8px; }

  .progress { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0 10px; margin-top: 6px; }
  .progress .meter { height: 8px; border-radius: 99px; background: var(--track); overflow: hidden; }
  .progress .meter i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
  .progress .txt { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }

  .cat { margin: 22px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); font-weight: 700; }
  .q { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; transition: border-color .2s; }
  .q.missing { border-color: var(--warn); }
  .q .t { font-size: 15px; margin: 0 0 10px; }
  .q .t b { color: var(--muted); font-weight: 600; margin-right: 6px; font-variant-numeric: tabular-nums; }
  .opts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .opts label { position: relative; cursor: pointer; }
  .opts input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
  .opts span {
    display: block; text-align: center; padding: 9px 0; border-radius: 10px;
    border: 1px solid var(--line); font-weight: 700; font-size: 15px; color: var(--muted);
    transition: all .15s; user-select: none;
  }
  .opts label:hover span { border-color: var(--accent); color: var(--ink); }
  .opts input:checked + span { background: var(--accent); border-color: var(--accent); color: #fff; }
  .opts input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

  button.main, button.ghost, button.copy {
    font: inherit; cursor: pointer; border: 0; border-radius: 12px;
    padding: 12px 18px; font-weight: 700; background: var(--accent); color: #fff;
  }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btns { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .err { color: var(--warn); font-size: 14px; margin-top: 10px; min-height: 20px; }

  .result { display: none; }
  .result.show { display: block; }
  .gauge { position: relative; width: 230px; height: 230px; margin: 4px auto 10px; }
  .gauge svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .gauge .track { stroke: var(--track); }
  .gauge .bar { transition: stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1), stroke .6s; }
  .gauge .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .gauge .num { font-size: 52px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .gauge .num small { font-size: 22px; font-weight: 700; }
  .gauge .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .level { text-align: center; font-size: 22px; font-weight: 700; margin: 0; }
  .comment { text-align: center; color: var(--muted); margin: 6px 0 16px; }

  .visual { position: relative; overflow: hidden; background: var(--accent-soft); border-radius: 16px; padding: 22px 14px 18px; margin: 0 0 18px; text-align: center; }
  .scene { position: relative; z-index: 1; display: flex; justify-content: center; gap: 10px; font-size: 58px; line-height: 1.1; }
  .scene span { display: inline-block; animation: bob 1.4s ease-in-out infinite; }
  .scene span:nth-child(2) { animation-delay: .2s; }
  .scene span:nth-child(3) { animation-delay: .4s; }
  .scene span:nth-child(4) { animation-delay: .6s; }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-10px) rotate(4deg); } }
  .joke { position: relative; z-index: 1; margin: 14px 6px 0; font-size: 16px; font-weight: 600; }
  .hearts { position: absolute; inset: 0; pointer-events: none; }
  .hearts i { position: absolute; bottom: -30px; font-style: normal; opacity: 0; animation: rise linear infinite; }
  @keyframes rise { 0% { transform: translateY(0) scale(.8); opacity: 0; } 15% { opacity: .85; } 100% { transform: translateY(-260px) scale(1.2); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .scene span, .hearts i { animation: none; } .hearts { display: none; } }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
  .stat { background: var(--accent-soft); border-radius: 12px; padding: 10px 8px; text-align: center; }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11px; color: var(--muted); }
  .part { margin-bottom: 11px; }
  .part .top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  .part .top span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
  .meter2 { height: 9px; border-radius: 99px; background: var(--track); overflow: hidden; }
  .meter2 i { display: block; height: 100%; border-radius: 99px; background: var(--accent); transition: width .7s ease; }
  .eyebrow { text-align: center; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 6px; }
  .level.big { font-size: 26px; }
  .traits { display: grid; gap: 10px; margin-bottom: 18px; }
  .trait { display: flex; gap: 14px; align-items: center; background: var(--accent-soft); border-radius: 12px; padding: 10px 14px; }
  .trait .e { font-size: 30px; }
  .trait b { display: block; }
  .trait span { font-size: 13px; color: var(--muted); }
  .likes { list-style: none; padding: 0; margin: 0 0 6px; }
  .likes li { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .likes li::before { content: '❤️ '; }
  .note { font-size: 12px; color: var(--muted); margin-top: 12px; }
</style>
</head>

            'Heyecanı ve enerjisi bulaşıcı.',
            'Plansız anları eğlenceli hale getiriyor.',
            'Gerektiğinde cesur davranabiliyor.',
            'Hayata hevesle bakıyor.'
          ] },
        { cat: 'Sakinlik ve huzur', emoji: '🌿', title: 'Huzur Bulucu', scene: '🌿🧘🌙', heart: '🌿',
          desc: 'Sakinliği ve sabrı seni dinlendiriyor. Onun yanında dünya biraz yavaşlıyor.',
          joke: 'Yanında telefon bildirimleri bile sessize alınmış gibi.',
          items: [
            'Yanında kendimi dinlenmiş hissediyorum.',
            'Zor anlarda sakin kalabiliyor.',
            'Gereksiz tartışma çıkarmıyor.',
            'Sabırlı biri.',
            'Varlığı bana huzur veriyor.'
          ] },
        { cat: 'Tarz ve çekicilik', emoji: '✨', title: 'Estetik Hayranı', scene: '✨😎💫', heart: '✨',
          desc: 'Duruşu, tarzı ve çekiciliği seni etkiliyor. Bir bakışı ya da gülüşü gününü bir anda değiştirebiliyor.',
          joke: 'Bazen sadece bakıp "ya bu kadar da olmaz" diyorsun.',
          items: [
            'Dış görünüşünü çekici buluyorum.',
            'Giyim tarzını ve duruşunu seviyorum.',
            'Bakışı ve gülüşü beni etkiliyor.',
            'Sesi ya da kokusu beni etkiliyor.',
            'Kendine özgü bir tarzı var.'
          ] },
        { cat: 'Azim ve hırs', emoji: '💪', title: 'Azim Hayranı', scene: '💪🎯🏆', heart: '💪',
          desc: 'Hırsı, sorumluluğu ve çalışkanlığı seni etkiliyor. Hayallerine sahip çıkan biri olması seni gururlandırıyor.',
          joke: 'Onun hedef listesi senin ilham panon.',
          items: [
            'Hedefleri için çalışıyor.',
            'Kolay vazgeçmiyor.',
            'Sorumluluk sahibi biri.',
            'İşine ve hayallerine değer veriyor.',
            'Kendini geliştirmeye çalışıyor.'
          ] }
      ],
      balanced: { title: 'Bütün Paket Hayranı', scene: '🥰🎁✨', heart: '💖',
        desc: 'Tek bir özelliğe değil, onu bir bütün olarak seviyorsun. Hangi yönüne baksan seni etkiliyor.',
        joke: 'Kataloğun hiçbir sayfasını atlamamışsın.' },
      low: { title: 'Keşif Aşamasındasın', scene: '🔍🌱🙂', heart: '🌱',
        desc: 'Özellikleri henüz belirgin şekilde öne çıkmamış. Zaman geçtikçe onda neyi sevdiğini daha net göreceksin.',
        joke: 'Tanışma faslı sürüyor, güzel şeyler yeni başlıyor.' }
    }
  ];

  /* ================= YARDIMCILAR ================= */
  var CIRC = 2 * Math.PI * 84;
  function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }
  function f1(n) { return n.toFixed(1).replace('.', ','); }

  // Ortalama 1 ile 5 arasındadır. Oran = (ortalama - 1) / 4 * 100
  // Tüm cevaplar 1 ise %0, tüm cevaplar 5 ise %100 olur.
  function ratio(values) {
    var sum = values.reduce(function (s, v) { return s + v; }, 0);
    var avg = sum / values.length;
    return { sum: sum, avg: avg, pct: ((avg - 1) / 4) * 100 };
  }

  var DEFAULT_LEGEND = ['1 = Hiç katılmıyorum', '3 = Kararsızım', '5 = Tamamen katılıyorum'];
  function legendHtml(cfg) {
    var l = cfg.legend || DEFAULT_LEGEND;
    return '<div class="scale-legend"><span>' + l[0] + '</span><span>' + l[1] + '</span><span>' + l[2] + '</span></div>';
  }

  function buildForm(cfg) {
    var html = '', n = 0, catRanges = [];
    cfg.questions.forEach(function (c) {
      var start = n;
      html += '<div class="cat">' + c.emoji + ' ' + c.cat + '</div>';
      c.items.forEach(function (text) {
        n++;
        html += '<div class="q" data-q="' + n + '"><p class="t"><b>' + n + '.</b>' + text + '</p>' +
          '<div class="opts" role="radiogroup" aria-label="' + n + '. soru">';
        for (var v = 1; v <= 5; v++) {
          html += '<label><input type="radio" name="' + cfg.id + '_q' + n + '" value="' + v + '"><span>' + v + '</span></label>';
        }
        html += '</div></div>';
      });
      catRanges.push({ from: start + 1, to: n });
    });
    return { html: html, total: n, catRanges: catRanges };
  }

  /* ================= TEST BİLEŞENİ ================= */
  function createTest(cfg, root) {
    var total = 0;
    var catRanges = [];
    var html = '';
    var n = 0;

    cfg.questions.forEach(function (c) {
      var start = n;
      html += '<div class="cat">' + c.cat + '</div>';
      c.items.forEach(function (text) {
        n++;
        html += '<div class="q" data-q="' + n + '"><p class="t"><b>' + n + '.</b>' + text + '</p>' +
          '<div class="opts" role="radiogroup" aria-label="' + n + '. soru">';
        for (var v = 1; v <= 5; v++) {
          html += '<label><input type="radio" name="' + cfg.id + '_q' + n + '" value="' + v + '"><span>' + v + '</span></label>';
        }
        html += '</div></div>';
      });
      catRanges.push({ name: c.cat, from: start + 1, to: n });
    });
    total = n;

    root.innerHTML =
      '<div class="card"><p class="intro">' + cfg.intro + '</p>' +
      legendHtml(cfg) + '</div>' +
      '<div class="progress"><div class="txt"><span class="ptxt"></span><span class="ppct"></span></div>' +
      '<div class="meter"><i class="pbar"></i></div></div>' +
      '<form class="form" autocomplete="off">' + html + '</form>' +
      '<div class="btns"><button type="button" class="main calc">Oranı hesapla</button>' +
      '<button type="button" class="ghost reset">Sıfırla</button></div>' +
      '<div class="err" role="alert"></div>' +
      '<div class="card result" aria-live="polite">' +
        '<h2>Sonuç</h2>' +
        '<div class="gauge"><svg viewBox="0 0 200 200">' +
          '<circle class="track" cx="100" cy="100" r="84" fill="none" stroke-width="16"></circle>' +
          '<circle class="bar" cx="100" cy="100" r="84" fill="none" stroke-width="16" stroke-linecap="round"></circle></svg>' +
          '<div class="center"><div class="num"><span class="score">0</span><small>%</small></div>' +
          '<div class="lbl">' + cfg.gaugeLabel + '</div></div></div>' +
        '<p class="level"></p><p class="comment"></p>' +
        '<div class="visual"><div class="hearts" aria-hidden="true"></div><div class="scene"></div><p class="joke"></p></div>' +
        '<div class="stats">' +
          '<div class="stat"><b class="sum">0</b><span>toplam puan</span></div>' +
          '<div class="stat"><b class="avg">0</b><span>ortalama (5 üzerinden)</span></div>' +
          '<div class="stat"><b class="top">0</b><span>5 puan verilen ifade</span></div></div>' +
        '<h2>Kategorilere göre</h2><div class="cats"></div>' +
        '<p class="note formula"></p>' +
        '<div class="btns"><button type="button" class="copy">Sonucu kopyala</button></div>' +
      '</div>';

    var $ = function (sel) { return root.querySelector(sel); };
    var form = $('.form');
    var bar = $('.gauge .bar');
    bar.style.strokeDasharray = CIRC;
    bar.style.strokeDashoffset = CIRC;
    var shown = 0, anim = null, lastText = '';

    function getAnswers() {
      var a = [];
      for (var i = 1; i <= total; i++) {
        var el = form.querySelector('input[name="' + cfg.id + '_q' + i + '"]:checked');
        a.push(el ? parseInt(el.value, 10) : null);
      }
      return a;
    }
    function qEl(i) { return form.querySelector('[data-q="' + i + '"]'); }

    function updateProgress() {
      var a = getAnswers();
      var done = a.filter(function (x) { return x !== null; }).length;
      $('.ptxt').textContent = done + ' / ' + total + ' cevaplandı';
      $('.ppct').textContent = '%' + Math.round((done / total) * 100);
      $('.pbar').style.width = ((done / total) * 100) + '%';
      a.forEach(function (x, i) { if (x !== null) qEl(i + 1).classList.remove('missing'); });
      if (done === total) $('.err').textContent = '';
    }
    form.addEventListener('change', updateProgress);

    function animateNumber(to) {
      if (anim) cancelAnimationFrame(anim);
      var from = shown, start = null, dur = 900;
      function step(ts) {
        if (start === null) start = ts;
        var k = Math.min(1, (ts - start) / dur);
        var e = 1 - Math.pow(1 - k, 3);
        shown = from + (to - from) * e;
        $('.score').textContent = f1(shown);
        if (k < 1) anim = requestAnimationFrame(step);
      }
      anim = requestAnimationFrame(step);
    }

    function renderVisual(lv, score) {
      $('.scene').innerHTML = Array.from(lv.scene).map(function (c) { return '<span>' + c + '</span>'; }).join('');
      $('.joke').textContent = lv.joke;
      var count = Math.round(score / 5) + 4;
      var h = '';
      for (var i = 0; i < count; i++) {
        h += '<i style="left:' + (Math.random() * 94).toFixed(1) + '%;font-size:' + (14 + Math.random() * 18).toFixed(0) +
          'px;animation-duration:' + (3 + Math.random() * 3.5).toFixed(1) + 's;animation-delay:' + (-Math.random() * 6).toFixed(1) + 's">' + lv.heart + '</i>';
      }
      $('.hearts').innerHTML = h;
    }

    function calculate() {
      var a = getAnswers();
      var missing = [];
      a.forEach(function (x, i) { if (x === null) missing.push(i + 1); });
      if (missing.length) {
        missing.forEach(function (m) { qEl(m).classList.add('missing'); });
        $('.err').textContent = missing.length + ' ifade cevapsız kaldı. İlk boş olan: ' + missing[0] + '. soru.';
        qEl(missing[0]).scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      $('.err').textContent = '';

      var r = ratio(a);
      var score = r.pct;
      var lv = cfg.levels.filter(function (l) { return score < l.max; })[0] || cfg.levels[cfg.levels.length - 1];

      $('.result').classList.add('show');
      bar.style.stroke = 'hsl(' + (200 + score * 1.6).toFixed(0) + ', 75%, 55%)';
      bar.style.strokeDashoffset = (CIRC * (1 - score / 100)).toFixed(2);
      animateNumber(score);

      $('.level').textContent = lv.name;
      $('.comment').textContent = lv.text;
      renderVisual(lv, score);
      $('.sum').textContent = r.sum + ' / ' + (total * 5);
      $('.avg').textContent = f1(r.avg);
      $('.top').textContent = a.filter(function (x) { return x === 5; }).length;

      var ch = '', best = null;
      catRanges.forEach(function (c) {
        var cr = ratio(a.slice(c.from - 1, c.to));
        if (!best || cr.pct > best.pct) best = { name: c.name, pct: cr.pct };
        ch += '<div class="part"><div class="top"><span>' + c.name + '</span><span>ort. ' + f1(cr.avg) + ' / 5 &nbsp; %' + Math.round(cr.pct) + '</span></div>' +
          '<div class="meter2"><i style="width:' + cr.pct.toFixed(1) + '%"></i></div></div>';
      });
      $('.cats').innerHTML = ch;
      $('.formula').textContent = 'Hesap: ortalama = toplam puan / ' + total + ' soru = ' + f1(r.avg) +
        '. Oran = (ortalama - 1) / 4 x 100 = %' + f1(score) + '. En yüksek kategori: ' + best.name + '.';

      lastText = cfg.copyPrefix + ': %' + f1(score) + ' (' + lv.name + '). Toplam ' + r.sum + '/' + (total * 5) + ', ortalama ' + f1(r.avg) + '/5.';
      $('.result').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    $('.calc').addEventListener('click', calculate);

    $('.reset').addEventListener('click', function () {
      form.reset();
      $('.result').classList.remove('show');
      $('.err').textContent = '';
      Array.prototype.forEach.call(form.querySelectorAll('.q'), function (q) { q.classList.remove('missing'); });
      bar.style.strokeDashoffset = CIRC;
      shown = 0;
      updateProgress();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    $('.copy').addEventListener('click', function () {
      var btn = $('.copy');
      function done(ok) {
        btn.textContent = ok ? 'Kopyalandı' : 'Kopyalanamadı';
        setTimeout(function () { btn.textContent = 'Sonucu kopyala'; }, 1500);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(lastText).then(function () { done(true); }, function () { done(false); });
      } else { done(false); }
    });

    updateProgress();
  }

  /* ================= NİTEL PROFİL BİLEŞENİ ================= */
  function strengthWord(avg) {
    if (avg >= 4.5) return 'Tutkuyla seviyorsun';
    if (avg >= 3.75) return 'Çok seviyorsun';
    if (avg >= 3) return 'Beğeniyorsun';
    if (avg >= 2) return 'Fark ediyorsun';
    return 'Pek öne çıkmıyor';
  }

  function createProfile(cfg, root) {
    var f = buildForm(cfg);
    var total = f.total;

    root.innerHTML =
      '<div class="card"><p class="intro">' + cfg.intro + '</p>' + legendHtml(cfg) + '</div>' +
      '<div class="progress"><div class="txt"><span class="ptxt"></span><span class="ppct"></span></div>' +
      '<div class="meter"><i class="pbar"></i></div></div>' +
      '<form class="form" autocomplete="off">' + f.html + '</form>' +
      '<div class="btns"><button type="button" class="main calc">Profilimi göster</button>' +
      '<button type="button" class="ghost reset">Sıfırla</button></div>' +
      '<div class="err" role="alert"></div>' +
      '<div class="card result" aria-live="polite">' +
        '<h2>Sonuç</h2>' +
        '<p class="eyebrow">Onda en çok sevdiğin yön</p>' +
        '<p class="level big"></p><p class="comment"></p>' +
        '<div class="visual"><div class="hearts" aria-hidden="true"></div><div class="scene"></div><p class="joke"></p></div>' +
        '<h2>Öne çıkan yönler</h2><div class="traits"></div>' +
        '<div class="likes-wrap"><h2>Özellikle sevdiklerin</h2><ul class="likes"></ul></div>' +
        '<p class="note low"></p>' +
        '<div class="btns"><button type="button" class="copy">Sonucu kopyala</button></div>' +
      '</div>';

    var $ = function (sel) { return root.querySelector(sel); };
    var form = $('.form');
    var lastText = '';

    function getAnswers() {
      var a = [];
      for (var i = 1; i <= total; i++) {
        var el = form.querySelector('input[name="' + cfg.id + '_q' + i + '"]:checked');
        a.push(el ? parseInt(el.value, 10) : null);
      }
      return a;
    }
    function qEl(i) { return form.querySelector('[data-q="' + i + '"]'); }

    function updateProgress() {
      var a = getAnswers();
      var done = a.filter(function (x) { return x !== null; }).length;
      $('.ptxt').textContent = done + ' / ' + total + ' cevaplandı';
      $('.ppct').textContent = '%' + Math.round((done / total) * 100);
      $('.pbar').style.width = ((done / total) * 100) + '%';
      a.forEach(function (x, i) { if (x !== null) qEl(i + 1).classList.remove('missing'); });
      if (done === total) $('.err').textContent = '';
    }
    form.addEventListener('change', updateProgress);

    function renderVisual(scene, joke, heart) {
      $('.scene').innerHTML = Array.from(scene).map(function (c) { return '<span>' + c + '</span>'; }).join('');
      $('.joke').textContent = joke;
      var h = '';
      for (var i = 0; i < 12; i++) {
        h += '<i style="left:' + (Math.random() * 94).toFixed(1) + '%;font-size:' + (14 + Math.random() * 18).toFixed(0) +
          'px;animation-duration:' + (3 + Math.random() * 3.5).toFixed(1) + 's;animation-delay:' + (-Math.random() * 6).toFixed(1) + 's">' + heart + '</i>';
      }
      $('.hearts').innerHTML = h;
    }

    function calculate() {
      var a = getAnswers();
      var missing = [];
      a.forEach(function (x, i) { if (x === null) missing.push(i + 1); });
      if (missing.length) {
        missing.forEach(function (m) { qEl(m).classList.add('missing'); });
        $('.err').textContent = missing.length + ' ifade cevapsız kaldı. İlk boş olan: ' + missing[0] + '. soru.';
        qEl(missing[0]).scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      $('.err').textContent = '';

      var groups = cfg.questions.map(function (c, i) {
        var r = f.catRanges[i];
        var vals = a.slice(r.from - 1, r.to);
        return { c: c, idx: i, vals: vals, avg: ratio(vals).avg, from: r.from };
      });
      var overall = ratio(a).avg;
      var ranked = groups.slice().sort(function (x, y) { return (y.avg - x.avg) || (x.idx - y.idx); });
      var spread = ranked[0].avg - ranked[ranked.length - 1].avg;

      var view;
      if (overall < 2.2) view = cfg.low;
      else if (spread <= 0.4 && overall >= 3) view = cfg.balanced;
      else view = { title: ranked[0].c.title, scene: ranked[0].c.scene, heart: ranked[0].c.heart, desc: ranked[0].c.desc, joke: ranked[0].c.joke };

      $('.result').classList.add('show');
      $('.level').textContent = view.title;
      var desc = view.desc;
      if (view === cfg.low || view === cfg.balanced) { /* tek paragraf yeterli */ }
      else if (ranked[1].avg >= 3) {
        desc += ' İkinci sırada ' + ranked[1].c.cat.toLocaleLowerCase('tr') + ' geliyor.';
      }
      $('.comment').textContent = desc;
      renderVisual(view.scene, view.joke, view.heart);

      var top = ranked.filter(function (g) { return g.avg >= 3; }).slice(0, 3);
      var th = '';
      top.forEach(function (g) {
        th += '<div class="trait"><div class="e">' + g.c.emoji + '</div><div><b>' + g.c.cat + '</b><span>' + strengthWord(g.avg) + '</span></div></div>';
      });
      if (!top.length) th = '<p class="note">Henüz belirgin bir yön öne çıkmadı.</p>';
      $('.traits').innerHTML = th;

      var likes = [];
      ranked.forEach(function (g) {
        g.vals.forEach(function (v, k) { if (v === 5) likes.push(g.c.items[k]); });
      });
      if (!likes.length) {
        ranked.forEach(function (g) {
          g.vals.forEach(function (v, k) { if (v === 4) likes.push(g.c.items[k]); });
        });
      }
      likes = likes.slice(0, 6);
      $('.likes-wrap').style.display = likes.length ? '' : 'none';
      $('.likes').innerHTML = likes.map(function (t) { return '<li>' + t + '</li>'; }).join('');

      var lowest = ranked[ranked.length - 1];
      var note = $('.note.low');
      if (view !== cfg.low && lowest.avg < 3) {
        note.textContent = 'Şimdilik daha az öne çıkan yön: ' + lowest.c.cat.toLocaleLowerCase('tr') + '. Zamanla bu tarafını da keşfedebilirsin.';
        note.style.display = '';
      } else {
        note.style.display = 'none';
      }

      var names = top.map(function (g) { return g.c.cat.toLocaleLowerCase('tr'); });
      lastText = cfg.copyPrefix + ': ' + view.title + (names.length ? ' (' + names.join(', ') + ')' : '') + '. ' + view.joke;
      $('.result').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    $('.calc').addEventListener('click', calculate);

    $('.reset').addEventListener('click', function () {
      form.reset();
      $('.result').classList.remove('show');
      $('.err').textContent = '';
      Array.prototype.forEach.call(form.querySelectorAll('.q'), function (q) { q.classList.remove('missing'); });
      updateProgress();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    $('.copy').addEventListener('click', function () {
      var btn = $('.copy');
      function done(ok) {
        btn.textContent = ok ? 'Kopyalandı' : 'Kopyalanamadı';
        setTimeout(function () { btn.textContent = 'Sonucu kopyala'; }, 1500);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(lastText).then(function () { done(true); }, function () { done(false); });
      } else { done(false); }
    });

    updateProgress();
  }

  /* ================= SEKMELER ================= */
  var tabsEl = document.getElementById('tabs');
  var panelsEl = document.getElementById('panels');
  var tabBtns = {}, panelEls = {};

  TESTS.forEach(function (cfg) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'tab';
    b.id = 'tab-' + cfg.id;
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-controls', 'panel-' + cfg.id);
    b.textContent = cfg.tab;
    b.addEventListener('click', function () { select(cfg.id, true); });
    tabsEl.appendChild(b);
    tabBtns[cfg.id] = b;

    var p = document.createElement('section');
    p.className = 'panel';
    p.id = 'panel-' + cfg.id;
    p.setAttribute('role', 'tabpanel');
    p.setAttribute('aria-labelledby', 'tab-' + cfg.id);
    panelsEl.appendChild(p);
    panelEls[cfg.id] = p;
    if (cfg.mode === 'profile') createProfile(cfg, p); else createTest(cfg, p);
  });

  function select(id, updateHash) {
    TESTS.forEach(function (cfg) {
      var on = cfg.id === id;
      tabBtns[cfg.id].setAttribute('aria-selected', on ? 'true' : 'false');
      panelEls[cfg.id].hidden = !on;
    });
    if (updateHash) {
      try { history.replaceState(null, '', '#' + id); } catch (e) { /* önemsiz */ }
    }
    window.scrollTo({ top: 0 });
  }

  var initial = (location.hash || '').replace('#', '');
  select(panelEls[initial] ? initial : TESTS[0].id, false);
})();
</script>
</body>
</html>
